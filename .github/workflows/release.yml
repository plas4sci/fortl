name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-x86_64
            os: macos-13
          - platform: macos-aarch64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell and Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-setup-ghc: true
          cache: true

      - name: Build executables
        run: stack build --no-terminal --copy-bins --local-bin-path bin

      - name: Set artifact name
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="fortl-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          else
            name="fortl-${{ matrix.platform }}-${GITHUB_RUN_ID}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test executables
        shell: bash
        run: |
          ./bin/fortl examples/quantity.frtl
          printf ':q\n' | ./bin/fortli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${{ steps.meta.outputs.name }}"
          mkdir -p "dist/$name"
          cp bin/fortl bin/fortli LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ steps.meta.outputs.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item bin/fortl.exe, bin/fortli.exe, LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ runner.os == 'Windows' && format('dist/{0}.zip', steps.meta.outputs.name) || format('dist/{0}.tar.gz', steps.meta.outputs.name) }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
