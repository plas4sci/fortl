name: cosi-implementation
version: '0.3.0'
synopsis: A modern language for science
author: Dominic Orchard
copyright: 2024 authors
license: BSD3
dependencies:
- base >=4.10 && <5
- text
- array
- transformers
- containers
- directory
- filepath
- haskeline

ghc-options:
- -O0
- -Wall
- -Werror
- -Wcompat
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wredundant-constraints
- -Wno-unused-matches
- -Wno-name-shadowing
- -Wno-type-defaults

executables:
  cosi:
    main: Lang/Frontend.hs
    source-dirs: src
    ghc-options: -main-is Lang.Frontend
    build-tools:
     - alex
     - happy
    dependencies:
     - cosi-implementation

  cosii:
    main: Lang/REPL.hs
    source-dirs: src
    ghc-options: -main-is Lang.REPL
    build-tools:
     - alex
     - happy
    dependencies:
     - cosi-implementation

library:
  source-dirs: src
  exposed-modules:
  - Lang.Semantics
  - Lang.Syntax
  - Lang.Parser
  - Lang.PrettyPrint
  - Lang.Frontend
  - Lang.Descriptions
  - Lang.TypeHelpers

tests:
  cosi-golden:
    main: Spec.hs
    source-dirs: tests
    dependencies:
    - cosi-implementation
    - strict
    - Diff
    - tasty
    - tasty-golden
    - tasty-hunit